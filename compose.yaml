# All-NVFP4 DFlash2 release — vLLM v0.27.1 + DFlash2 K7 + NVFP4 target/draft/KV.
#
# Services:
#   model-cache-init  one-shot: fix ownership of the shared model/vllm caches
#   draft-cache-init  one-shot: pull the pinned all-NVFP4 DFlash2 drafter
#   server            GPU vLLM server (fused multimodal/text path)
#   vision            OPTIONAL CPU vision sidecar (profile "vision")
#
# Golden path (vision on):  docker compose --profile vision up -d
# Golden path (text only):  docker compose up -d
#
# The server downloads the pinned target checkpoint into the hf-cache volume on
# first boot (~20.6 GB). The incremental .3 overlay keeps the fused
# QK-norm/RoPE/gate path enabled for the multimodal model configuration.

name: qwen38-dflash2

services:
  model-cache-init:
    image: ${IMAGE}
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /home/vllm/.cache/huggingface /home/vllm/.cache/vllm && chown -R 2000:0 /home/vllm/.cache"]
    restart: "no"
    volumes:
      - hf-cache:/home/vllm/.cache/huggingface
      - vllm-cache:/home/vllm/.cache/vllm

  draft-cache-init:
    image: ${IMAGE}
    user: "0:0"
    entrypoint: ["sh", "-c"]
    # One-shot: pull the pinned all-NVFP4 DFlash2 drafter into the shared
    # draft-cache volume (idempotent: hf skips existing files).
    command: ["hf download ${DRAFT_ID} --revision ${DRAFT_REVISION} --local-dir /models/draft && chown -R 2000:0 /models/draft"]
    restart: "no"
    volumes:
      - draft-cache:/models/draft
    environment:
      HF_TOKEN: ${HF_TOKEN:-}

  server:
    image: ${IMAGE}
    container_name: qwen38-dflash2-server
    gpus: all
    shm_size: "8gb"
    restart: unless-stopped
    depends_on:
      model-cache-init:
        condition: service_completed_successfully
      draft-cache-init:
        condition: service_completed_successfully
    ports:
      - "0.0.0.0:${VLLM_PORT}:8000"
    environment:
      HF_HOME: /home/vllm/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      VLLM_USE_FLASHINFER_SAMPLER: "0"
      # V2 runner UVA buffers need pinned memory; WSL2 disables it by default.
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
      # Validated capacity-first runtime: eager drafter avoids integrated XQA
      # graph interference; the target retains FULL graph execution.
      VLLM_DFLASH_FORCE_EAGER: "1"
      VLLM_XQA_DEDICATED_STREAM: "1"
      # Production observability defaults: no benchmark instrumentation.
      VLLM_DFLASH_NVTX: "0"
      VLLM_FLASHINFER_LOG_XQA_SHAPES: "0"
      VLLM_CG_LOG_DISPATCH: "0"
      # Triton compiles the new M-RoPE variants on first use. Persist the JIT
      # cache in the existing vLLM volume so restarts do not recompile them.
      TRITON_CACHE_DIR: /home/vllm/.cache/vllm/triton
      NVIDIA_VISIBLE_DEVICES: ${GPU_DEVICE:-0}
      CUDA_DEVICE_ORDER: PCI_BUS_ID
    volumes:
      - hf-cache:/home/vllm/.cache/huggingface
      - vllm-cache:/home/vllm/.cache/vllm
      - ./chat-template.jinja:/opt/vllm-release/chat-template.jinja:ro
      - draft-cache:/models/draft:ro
      - ${TARGET_MODEL_DIR:-/nonexistent}:/models/target:ro
    command:
      - --model
      - ${SERVER_MODEL:-${MODEL_ID}}
      - --revision
      - ${MODEL_REVISION}
      - --speculative-config
      - '{"method":"dflash","model":"/models/draft","num_speculative_tokens":${NUM_SPECULATIVE_TOKENS},"kv_cache_dtype":"${DRAFT_KV_CACHE_DTYPE}","num_speculative_tokens_per_batch_size":${DYNAMIC_SCHEDULE:-null}}'
      - --served-model-name
      - ${SERVED_MODEL_NAME}
      - --quantization
      - modelopt
      - --trust-remote-code
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"enable_thinking":true,"reasoning_effort":"medium"}'
      - --override-generation-config
      - '{"temperature":0.6}'
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --chat-template
      - /opt/vllm-release/chat-template.jinja
      - --enable-mm-embeds
      - --limit-mm-per-prompt
      - '{"image":0,"video":0}'
      - --kv-cache-dtype
      - nvfp4
      - --kv-cache-memory-bytes
      - "${KV_CACHE_MEMORY_BYTES}"
      - --mamba-ssm-cache-dtype
      - "${MAMBA_SSM_CACHE_DTYPE:-float32}"
      - --max-model-len
      - "${MAX_MODEL_LEN}"
      - --max-num-seqs
      - "${MAX_NUM_SEQS}"
      - --max-num-batched-tokens
      - "${MAX_NUM_BATCHED_TOKENS}"
      - --long-prefill-token-threshold
      - "2048"
      - --scheduling-policy
      - priority
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --compilation-config
      - '{"cudagraph_mode":"${CUDAGRAPH_MODE}","cudagraph_capture_sizes":${CUDAGRAPH_CAPTURE_SIZES}}'
      - --attention-config
      - '{"flash_attn_version":2}'
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 360
      start_period: 30s

  vision:
    image: ${IMAGE}
    container_name: qwen38-dflash2-vision
    restart: unless-stopped
    profiles: ["vision"]
    # Keep CPU vision work bounded so it cannot starve the GPU server or host.
    # 8 cores measured 1.6x faster encode than 4 (memory-bandwidth-bound under
    # WSL2, so sub-linear); mem/pid limits stay at the soft-lockup mitigation.
    cpus: "8.0"
    mem_limit: "6g"
    pids_limit: 256
    depends_on:
      server:
        condition: service_healthy
    entrypoint: ["python3", "/opt/vllm-release/sidecar.py"]
    command: ["8016"]
    ports:
      - "${BIND_ADDRESS}:${VISION_PORT}:8016"
    environment:
      HF_HOME: /home/vllm/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      SIDECAR_MODEL: ${MODEL_ID}
      SIDECAR_MODEL_REVISION: ${MODEL_REVISION}
      SIDECAR_UPSTREAM: http://server:8000
      SIDECAR_DEBUG: ${SIDECAR_DEBUG:-}
      # INT8 dynamic quantization of the ViT tower's Linear layers (default on;
      # set SIDECAR_INT8=0 for the fp32 eager fallback). ~1.5x faster encode.
      SIDECAR_INT8: ${SIDECAR_INT8:-1}
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      TORCH_NUM_THREADS: "8"
      TORCH_NUM_INTEROP_THREADS: "1"
    volumes:
      - hf-cache:/home/vllm/.cache/huggingface
      - ./sidecar.py:/opt/vllm-release/sidecar.py:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8016/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 120
      start_period: 30s

volumes:
  hf-cache:
    name: vllm-sm12x-qwen38-dflash2-model-cache
  vllm-cache:
    name: vllm-sm12x-qwen38-dflash2-vllm-cache
  draft-cache:
    name: vllm-sm12x-qwen38-dflash2-draft-cache
